spring:
  application:
    name: stockms-microservice

  datasource:
    url: jdbc:mysql://stock_db:3306/stock_db?useSSL=false&serverTimezone=UTC
    username: stock_user
    password: stock_pass
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.MySQL8Dialect
    show-sql: true

eureka:
  client:
    service-url:
      defaultZone: http://eureka-server:8761/eureka/
  instance:
    prefer-ip-address: true
