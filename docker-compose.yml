services:
  eureka-server:
    build: ./microservices/eureka-server
    container_name: eureka-server
    ports:
      - "8761:8761"

  pedido-microservice:
    build: ./microservices/pedido-microservice
    ports:
      - "8081:8080"
    depends_on:
      - eureka-server

  producto-microservice:
    build: ./microservices/producto-microservice
    ports:
      - "8082:8080"
    depends_on:
      - eureka-server

  pedidocomposition-microservice:
    build: ./microservices/pedidocomposition-microservice
    ports:
      - "8083:8080"
    depends_on:
      - pedido-microservice
      - producto-microservice
      - eureka-server
  stock-microservice:
    build: ./microservices/stockms-microservice
    ports:
      - "8086:8080"
    depends_on:
      - eureka-server
      - stock_db

  stock_db:
    image: mysql:8.0
    container_name: stock_db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: stock_db
      MYSQL_USER: stock_user
      MYSQL_PASSWORD: stock_pass
    ports:
      - "3307:3306"
    command: --default-authentication-plugin=mysql_native_password
    volumes:
      - stock_data:/var/lib/mysql

  pedido_db:
    image: postgres:15
    container_name: pedido_db
    ports:
      - "5434:5432"
    environment:
      POSTGRES_USER: pedido_user
      POSTGRES_PASSWORD: pedido_pass
      POSTGRES_DB: pedido_db

  producto_db:
    image: postgres:15
    container_name: producto_db
    ports:
      - "5435:5432"
    environment:
      POSTGRES_USER: producto_user
      POSTGRES_PASSWORD: producto_pass
      POSTGRES_DB: producto_db

volumes:
  pedido_data:
  producto_data:
  stock_data:
